<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <title>JSXGraph 3D SVG export spike</title>
  <link rel="stylesheet" href="../node_modules/jsxgraph/distrib/jsxgraph.css" />
  <script src="../node_modules/jsxgraph/distrib/jsxgraphcore.js"></script>
  <style>
    body { font-family: sans-serif; padding: 16px; }
    #board { width: 600px; height: 600px; border: 1px solid #ccc; }
    #out { font-family: monospace; font-size: 11px; max-height: 240px; overflow: auto; background: #f5f5f5; padding: 8px; margin-top: 12px; white-space: pre-wrap; }
    .stat { margin: 4px 0; }
    .stat strong { display: inline-block; width: 220px; }
  </style>
</head>
<body>
  <h1>JSXGraph 3D SVG export spike</h1>
  <p>Mục đích: verify <code>view3d</code> trong JSXGraph 1.12 xuất SVG markup đúng cho các 3D primitives mà Phase B (geometry-3d stamp) cần.</p>
  <div id="board"></div>
  <div id="stats"></div>
  <pre id="out"></pre>
  <script>
    JXG.Options.text.display = 'internal';
    const board = JXG.JSXGraph.initBoard('board', {
      boundingbox: [-6, 6, 6, -6],
      axis: false,
      showCopyright: false,
      showNavigation: false,
      renderer: 'svg',
    });

    const view = board.create('view3d',
      [[-5, -5], [10, 10], [[-3, 3], [-3, 3], [-3, 3]]],
      { projection: 'central' }
    );

    // Test 1: tetrahedron qua 4 polygon3d
    const A = view.create('point3d', [0, 0, 0], { name: 'A', size: 3 });
    const B = view.create('point3d', [2, 0, 0], { name: 'B', size: 3 });
    const C = view.create('point3d', [1, 2, 0], { name: 'C', size: 3 });
    const D = view.create('point3d', [1, 1, 2], { name: 'D', size: 3 });
    view.create('polygon3d', [[A, B, C]]);
    view.create('polygon3d', [[A, B, D]]);
    view.create('polygon3d', [[A, C, D]]);
    view.create('polygon3d', [[B, C, D]]);

    // Test 2: sphere3d
    view.create('sphere3d', [[4, 4, 0], 1.5]);

    // Test 3: cylinder/prism approximation — polyhedron3d trực tiếp (8 vertex)
    const P0 = view.create('point3d', [-3, -3, 0], { visible: false });
    const P1 = view.create('point3d', [-1, -3, 0], { visible: false });
    const P2 = view.create('point3d', [-1, -1, 0], { visible: false });
    const P3 = view.create('point3d', [-3, -1, 0], { visible: false });
    const P4 = view.create('point3d', [-3, -3, 1], { visible: false });
    const P5 = view.create('point3d', [-1, -3, 1], { visible: false });
    const P6 = view.create('point3d', [-1, -1, 1], { visible: false });
    const P7 = view.create('point3d', [-3, -1, 1], { visible: false });
    view.create('polyhedron3d', [[
      [P0, P1, P2, P3],
      [P4, P5, P6, P7],
      [P0, P1, P5, P4],
      [P1, P2, P6, P5],
      [P2, P3, P7, P6],
      [P3, P0, P4, P7],
    ]]);

    // Inspect SVG output after render
    setTimeout(() => {
      const svg = document.querySelector('#board svg');
      const stats = document.getElementById('stats');
      const out = document.getElementById('out');

      if (!svg) {
        stats.innerHTML = '<strong style="color:red">NO SVG ELEMENT — renderer fell back to canvas?</strong>';
        out.textContent = document.querySelector('#board').innerHTML.slice(0, 2000);
        return;
      }

      const all = svg.querySelectorAll('*');
      const paths = svg.querySelectorAll('path');
      const polys = svg.querySelectorAll('polygon');
      const polyl = svg.querySelectorAll('polyline');
      const ellipses = svg.querySelectorAll('ellipse, circle');
      const lines = svg.querySelectorAll('line');
      const texts = svg.querySelectorAll('text');
      const images = svg.querySelectorAll('image');

      stats.innerHTML = `
        <div class="stat"><strong>Total SVG nodes</strong> ${all.length}</div>
        <div class="stat"><strong>&lt;path&gt;</strong> ${paths.length}</div>
        <div class="stat"><strong>&lt;polygon&gt;</strong> ${polys.length}</div>
        <div class="stat"><strong>&lt;polyline&gt;</strong> ${polyl.length}</div>
        <div class="stat"><strong>&lt;ellipse&gt; / &lt;circle&gt;</strong> ${ellipses.length}</div>
        <div class="stat"><strong>&lt;line&gt;</strong> ${lines.length}</div>
        <div class="stat"><strong>&lt;text&gt;</strong> ${texts.length}</div>
        <div class="stat"><strong>&lt;image&gt; (rasterized?)</strong> ${images.length}</div>
      `;

      const head = svg.outerHTML.slice(0, 4000);
      out.textContent = head + (svg.outerHTML.length > 4000 ? '\n... (truncated)' : '');
      console.log('Total SVG nodes:', all.length, 'paths:', paths.length, 'polygons:', polys.length, 'circles+ellipses:', ellipses.length);
    }, 300);
  </script>
</body>
</html>
